version: v3
thresholds:
  # Base-rate-relative operating point (audit 2026-07 B3). A well-calibrated head
  # for a rare event rarely exceeds a fixed absolute probability, so an absolute
  # cut like 0.65 never fires. Instead a signal must be BOTH above an absolute
  # floor AND a meaningful multiple over the head's own base rate.
  # Measured, not guessed: scripts/run_operating_curve.py, 2026-09-08.
  # At the `move` head's 0.1732 base rate this is a 0.6667 calibrated cut,
  # ~400 alerts/day across 27 symbols, precision 0.631 (lift 3.64, bound 1.16).
  #
  # The previous 2.0 was never measured against anything. It works out to a
  # 0.2953 cut — looser than every point on the curve, so the scanner was
  # emitting MORE than 400/day and the concurrency limiter was picking which
  # five survived.
  #
  # Deliberately not tighter. The curve keeps improving (0.846 at 100/day,
  # 1.000 at 20/day) but those rest on 2 independent episodes in a 6-hour test
  # segment, which is a lucky draw rather than evidence. Re-run the curve once
  # more history has accumulated (roadmap D3) before tightening further.
  prob_lift_min: 9.55
  prob_abs_floor: 0.12    # ...and never below this absolute calibrated prob
  # NOT APPLIED while the model has a `move` head. The directional filter asks
  # |p_up - p_down| to be large, which suppresses exactly the two-sided volatile
  # setups a volatility scanner should surface — and it was screening on a
  # difference measured to carry no directional information at all (precision
  # 0.590 vs a 0.587 base rate). Kept for models predating the change and for
  # the D10 revisit.
  directional_score_min: 0.05   # |p_up - p_down| conviction (was 0.20)
  spread_bps_max: 30.0
  min_liquidity_score: 0.30
  cooldown_sec: 90
  concurrent_limit: 5
  # Legacy absolute cuts — used only if prob_lift_min is removed above.
  # `move` gets its own floor: its base rate (~7.5%) is higher than either
  # direction head's, so the shared prob_abs_floor would bind instead of the
  # lift and make the gate less selective than intended.
  move_prob_calibrated_min: 0.65
  pump_prob_calibrated_min: 0.65
  dump_prob_calibrated_min: 0.65
