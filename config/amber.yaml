project:
  name: amber
  environment: local
run:
  timezone: UTC
  log_level: INFO
storage:
  root: data
  raw_dir: data/raw
  features_dir: data/features
  datasets_dir: data/datasets
  models_dir: data/models
  state_dir: data/state
  logs_dir: data/logs
exchange:
  bybit:
    testnet: false
    ws_url: wss://stream.bybit.com/v5/public/linear
    rest_url: https://api.bybit.com
    symbols:
    - BTCUSDT
    - ETHUSDT
signal:
  schema_version: v1
  top_k_universe: 20
  min_dollar_volume: 0.0
scanner:
  interval_sec: 60
pipeline:
  loop_sec: 60   # how often the auto-pipeline runs normalize + features
alerts:
  channels:
  - console
  # 'telegram' needs AMBER_TG_TOKEN / AMBER_TG_CHAT env vars;
  # 'discord' needs AMBER_DISCORD_WEBHOOK.

labeling:
  horizon_steps: 5
  horizon_steps_list: [5, 10, 20]
  up_pct: 0.002
  down_pct: 0.002
  adaptive_thresholds: true
  threshold_k: 2.5
  threshold_vol_window: 60
  threshold_floor: 0.003
  threshold_cap: 0.05
  # drop warm-up rows whose long-lookback features are still degenerate
  min_warmup_bars: 60

model:
  cv:
    n_folds: 3
    val_size: 50
    gap_candles: 30
  split:
    train_frac: 0.7
    calib_frac: 0.15
  calibration:
    holdout_ratio: 0.2
  eval:
    threshold: 0.7

monitoring:
  model_eval_fresh_sec: 21600
  require_model_eval_for_overall_ok: true
