project:
  name: amber
  environment: local
run:
  timezone: UTC
  log_level: INFO
storage:
  root: data
  keep_runs: 5   # how many model/calibration runs to retain on disk
  # Datasets get a tighter budget of their own: each hourly rebuild is hundreds
  # of MB (vs a few MB per model) and is fully regenerable from features/ in
  # about a minute. Retaining 5 of them once filled a 59 GB disk.
  keep_dataset_runs: 2
  raw_dir: data/raw
  features_dir: data/features
  datasets_dir: data/datasets
  models_dir: data/models
  state_dir: data/state
  logs_dir: data/logs
exchange:
  bybit:
    testnet: false
    ws_url: wss://stream.bybit.com/v5/public/linear
    rest_url: https://api.bybit.com
    backfill_limit: 1000   # REST klines per symbol per backfill (Bybit max 1000 ≈ 16h of 1m history)
    symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - HYPEUSDT
    - XRPUSDT
    - BANKUSDT
    - DEXEUSDT
    - SOXLUSDT
    - ZECUSDT
    - XAUUSDT
    - SNDKUSDT
    - ONDOUSDT
    - DOGEUSDT
    - ENAUSDT
    - 1000PEPEUSDT
    - SUIUSDT
    - LINKUSDT
    - GRAMUSDT
    - PUMPFUNUSDT
    - LTCUSDT
    - BNBUSDT
    - AVAXUSDT
    - FARTCOINUSDT
    - STRKUSDT
    - SANDUSDT
    - UAIUSDT
    - BTWUSDT
signal:
  schema_version: v1
  top_k_universe: 20
  min_dollar_volume: 0.0
scanner:
  interval_sec: 60
pipeline:
  loop_sec: 60      # how often the auto-pipeline runs normalize + features
  retrain_min: 60   # how often it rebuilds the dataset + retrains (0 = off)
  # How often the operating-threshold sweep runs (minutes, 0 = off). It only
  # reports: the result appears on the Модель tab with an explicit apply
  # button, because auto-adopting whatever validates on a given day would be
  # multiple testing dressed up as tuning.
  tune_min: 1440
alerts:
  channels:
  - console
  # 'telegram' needs AMBER_TG_TOKEN / AMBER_TG_CHAT env vars;
  # 'discord' needs AMBER_DISCORD_WEBHOOK.

labeling:
  # Horizons and barrier are chosen from barrier-hitting statistics, not by feel.
  # At the old 5-bar horizon a 0.42% barrier was reached only ~35% of the time,
  # so ~58% of trades expired paying the fee for nothing, and break-even needed a
  # 60.7% win rate against 56.0% achieved. Costs (0.09% round trip) are simply
  # too large next to any move reachable in 5 minutes. Longer horizons fix both:
  # the barrier widens, so the fixed cost matters proportionally less, and there
  # is time to reach it. Simulated at 27-symbol volatility: 30 bars resolves ~72%
  # with break-even 56.1%, 60 bars resolves ~75% with break-even 54.3%.
  horizon_steps: 15
  horizon_steps_list: [15, 30, 60]
  up_pct: 0.002
  down_pct: 0.002
  adaptive_thresholds: true
  # With scale_threshold_by_horizon the barrier is k * sigma * sqrt(horizon), so
  # k reads as "standard deviations of the h-bar move" and every horizon asks an
  # equally hard question. Previously one absolute barrier was applied to all
  # horizons, which made the same 0.42% a stretch over 5 bars and easy over 20
  # while the rows were pooled into a single dataset.
  scale_threshold_by_horizon: true
  threshold_k: 0.8
  threshold_vol_window: 60
  # Floor kept above ~0.56%: below that the round-trip cost alone pushes the
  # break-even win rate past 58%, i.e. the label is unprofitable by construction.
  threshold_floor: 0.005
  threshold_cap: 0.05
  # drop warm-up rows whose long-lookback features are still degenerate
  min_warmup_bars: 60
  # Rolling training window: candles per symbol that enter the dataset (0 = all
  # history). Dataset rows ≈ symbols × this × len(horizon_steps_list), and the
  # dataset is materialised in memory several times per retrain, so this is what
  # bounds RAM. 2880 (~2 days) × 27 symbols × 3 horizons ≈ 230k rows, which is
  # what the model was already training on. Raise it only with RAM to spare.
  max_candles_per_symbol: 2880

model:
  cv:
    n_folds: 3
    val_size: 50
    gap_candles: 30
  split:
    train_frac: 0.7
    calib_frac: 0.15
  calibration:
    holdout_ratio: 0.2
    # platt = smooth logistic fit (continuous probabilities). isotonic is a
    # step function that collapses to a few dozen levels on rare events, which
    # made live signals repeat identical probabilities and left the model
    # unable to rank symbols. Set to 'isotonic' to restore the old behaviour.
    method: platt
  eval:
    threshold: 0.7

monitoring:
  model_eval_fresh_sec: 21600
  require_model_eval_for_overall_ok: true
