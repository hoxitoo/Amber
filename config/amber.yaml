project:
  name: amber
  environment: local
run:
  timezone: UTC
  log_level: INFO
storage:
  root: data
  keep_runs: 5   # how many model/calibration runs to retain on disk
  # Datasets get a tighter budget of their own: each hourly rebuild is hundreds
  # of MB (vs a few MB per model) and is fully regenerable from features/ in
  # about a minute. Retaining 5 of them once filled a 59 GB disk.
  keep_dataset_runs: 2
  raw_dir: data/raw
  features_dir: data/features
  datasets_dir: data/datasets
  models_dir: data/models
  state_dir: data/state
  logs_dir: data/logs
exchange:
  bybit:
    testnet: false
    ws_url: wss://stream.bybit.com/v5/public/linear
    rest_url: https://api.bybit.com
    backfill_limit: 1000   # REST klines per symbol per backfill (Bybit max 1000 ≈ 16h of 1m history)
    symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - HYPEUSDT
    - XRPUSDT
    - BANKUSDT
    - DEXEUSDT
    - SOXLUSDT
    - ZECUSDT
    - XAUUSDT
    - SNDKUSDT
    - ONDOUSDT
    - DOGEUSDT
    - ENAUSDT
    - 1000PEPEUSDT
    - SUIUSDT
    - LINKUSDT
    - GRAMUSDT
    - PUMPFUNUSDT
    - LTCUSDT
    - BNBUSDT
    - AVAXUSDT
    - FARTCOINUSDT
    - STRKUSDT
    - SANDUSDT
    - UAIUSDT
    - BTWUSDT
signal:
  schema_version: v1
  top_k_universe: 20
  min_dollar_volume: 0.0
scanner:
  interval_sec: 60
pipeline:
  loop_sec: 60      # how often the auto-pipeline runs normalize + features
  retrain_min: 60   # how often it rebuilds the dataset + retrains (0 = off)
  # How often the operating-threshold sweep runs (minutes, 0 = off). It only
  # reports: the result appears on the Модель tab with an explicit apply
  # button, because auto-adopting whatever validates on a given day would be
  # multiple testing dressed up as tuning.
  tune_min: 1440
  # Calibration goes stale faster than the model itself: it maps scores to an
  # event frequency, and that frequency moves with the market regime. Refitting
  # is two coefficients on a few thousand rows, so it runs far more often than
  # a retrain (minutes, 0 = off).
  recal_min: 20
alerts:
  channels:
  - console
  # 'telegram' needs AMBER_TG_TOKEN / AMBER_TG_CHAT env vars;
  # 'discord' needs AMBER_DISCORD_WEBHOOK.

labeling:
  # Horizons and barrier are chosen from barrier-hitting statistics, not by feel.
  # At the old 5-bar horizon a 0.42% barrier was reached only ~35% of the time,
  # so ~58% of trades expired paying the fee for nothing, and break-even needed a
  # 60.7% win rate against 56.0% achieved. Costs (0.09% round trip) are simply
  # too large next to any move reachable in 5 minutes. Longer horizons fix both:
  # the barrier widens, so the fixed cost matters proportionally less, and there
  # is time to reach it. Simulated at 27-symbol volatility: 30 bars resolves ~72%
  # with break-even 56.1%, 60 bars resolves ~75% with break-even 54.3%.
  horizon_steps: 15
  # 60 dropped: the label sweep cannot compare horizons on a 48h window (see
  # below), but at h=60 it had only 4 independent episodes in the test segment,
  # so those rows were costing a third of the build for no measurable return.
  horizon_steps_list: [15, 30]
  # Fixed 1.0% barrier, chosen by scripts/run_label_sweep.py on 2026-09-06.
  #
  # The sweep ranked 24 label definitions by lift over base rate at the lag a
  # human acts under, with a family-wise correction and alerts collapsed into
  # market episodes. Within BOTH h=15 and h=30 the ordering was identical, 8 of
  # 8 (Spearman 0.976): fixed_100 > fixed_070 > slow_vol > fast_vol. The former
  # adaptive setting was the WORST of all 24 arms, at lift 0.21-0.39 — below 1.0,
  # i.e. its alerts were indistinguishable from firing at random.
  #
  # Why the adaptive barrier failed: at 1m crypto volatility `k*sigma*sqrt(h)`
  # fell below threshold_floor for 82% of rows at h=15, so the barrier was
  # already fixed at 0.5% almost everywhere. The 18% where it did scale were the
  # high-volatility rows — exactly where the model fires — so it widened the
  # target precisely where range_atr_14 (32% of permutation importance) would
  # otherwise have paid off. Adaptive where it hurt, fixed where it did not
  # matter. See docs/target_review_2026-09.md.
  up_pct: 0.010
  down_pct: 0.010
  adaptive_thresholds: false
  # "Did price rise 1% at any point within the horizon", not "did it rise 1%
  # before falling 1%". The triple barrier encodes a stop-loss, which is what a
  # mechanical trade experiences; Amber emits alerts and executes no orders, so
  # the claim it makes is the one-sided one. It beat two_sided in all 6
  # measurable matched pairs. Backtest PnL still uses first_hit, so trade
  # accounting keeps its stop-loss semantics regardless of this setting.
  label_shape: one_sided
  # --- INERT while adaptive_thresholds is false -----------------------------
  # Kept so `--rulers slow_vol,fast_vol` in the label sweep still reproduces the
  # old barriers, and so re-enabling adaptive mode does not need these values
  # rediscovered. They have NO effect on the live dataset as configured above.
  # Note threshold_floor is what quietly made the "adaptive" barrier fixed for
  # 82% of rows; if adaptive mode is ever revisited, that is the first thing to
  # re-derive, not threshold_k.
  scale_threshold_by_horizon: true
  threshold_k: 0.8
  threshold_vol_window: 60
  threshold_floor: 0.005
  threshold_cap: 0.05
  # drop warm-up rows whose long-lookback features are still degenerate
  min_warmup_bars: 60
  # Rolling training window: candles per symbol that enter the dataset (0 = all
  # history). Dataset rows ≈ symbols × this × len(horizon_steps_list), and the
  # dataset is materialised in memory several times per retrain, so this is what
  # bounds RAM. 2880 (~2 days) × 27 symbols × 3 horizons ≈ 230k rows, which is
  # what the model was already training on. Raise it only with RAM to spare.
  max_candles_per_symbol: 2880

model:
  cv:
    n_folds: 3
    val_size: 50
    gap_candles: 30
  split:
    train_frac: 0.7
    calib_frac: 0.15
  calibration:
    holdout_ratio: 0.2
    # platt = smooth logistic fit (continuous probabilities). isotonic is a
    # step function that collapses to a few dozen levels on rare events, which
    # made live signals repeat identical probabilities and left the model
    # unable to rank symbols. Set to 'isotonic' to restore the old behaviour.
    method: platt
  eval:
    threshold: 0.7

monitoring:
  model_eval_fresh_sec: 21600
  require_model_eval_for_overall_ok: true
