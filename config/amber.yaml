project:
  name: amber
  environment: local
run:
  timezone: UTC
  log_level: INFO
storage:
  root: data
  raw_dir: data/raw
  features_dir: data/features
  datasets_dir: data/datasets
  models_dir: data/models
  state_dir: data/state
  logs_dir: data/logs
exchange:
  bybit:
    testnet: false
    ws_url: wss://stream.bybit.com/v5/public/linear
    rest_url: https://api.bybit.com
    symbols:
    - BTCUSDT
    - ETHUSDT
signal:
  schema_version: v1
  top_k_universe: 20
alerts:
  channels:
  - console

labeling:
  horizon_steps: 5
  horizon_steps_list: [5, 10, 20]
  up_pct: 0.002
  down_pct: 0.002
  adaptive_thresholds: true
  threshold_k: 2.5
  threshold_vol_window: 60
  threshold_floor: 0.003
  threshold_cap: 0.05
